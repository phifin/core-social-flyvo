name: social-core
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_core}
      POSTGRES_USER: ${POSTGRES_USER:-social_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
  app:
    profiles: [app]
    build: .
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-social_core}
      DB_USERNAME: ${POSTGRES_USER:-social_core}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      SPRING_PROFILES_ACTIVE: local
      SMTP_HOST: mailpit
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTH_PRIVATE_KEY_FILE: /run/secrets/signing-private.pem
      AUTH_PUBLIC_KEY_FILE: /run/secrets/signing-public.pem
      MAIL_ENCRYPTION_KEY_FILE: /run/secrets/mail.b64
      LIMITER_KEY_FILE: /run/secrets/limiter.b64
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://silo:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_API_KEY_FILE: /run/secrets/storage-api.b64
      STORAGE_WORKER_KEY_FILE: /run/secrets/storage-worker.b64
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./.local/secrets/signing-private.pem:/run/secrets/signing-private.pem:ro
      - ./.local/secrets/signing-public.pem:/run/secrets/signing-public.pem:ro
      - ./.local/secrets/mail.b64:/run/secrets/mail.b64:ro
      - ./.local/secrets/limiter.b64:/run/secrets/limiter.b64:ro
      - ./.local/secrets/storage-api.b64:/run/secrets/storage-api.b64:ro
      - ./.local/secrets/storage-worker.b64:/run/secrets/storage-worker.b64:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DISABLE_VERSION_CHECK: "true"
  silo:
    profiles: [media]
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    command: [sh, /opt/storage/start.sh]
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.local/storage-data:/data
      - ./.local/secrets/storage-admin.b64:/run/secrets/storage-admin.b64:ro
      - ./.local/secrets/storage-kms.b64:/run/secrets/storage-kms.b64:ro
      - ./ops/local/storage:/opt/storage:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, silo, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
  silo-init:
    profiles: [media]
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    command: [sh, /opt/storage/init.sh]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      silo:
        condition: service_healthy
    volumes:
      - ./.local/secrets/storage-admin.b64:/run/secrets/storage-admin.b64:ro
      - ./.local/secrets/storage-api.b64:/run/secrets/storage-api.b64:ro
      - ./.local/secrets/storage-worker.b64:/run/secrets/storage-worker.b64:ro
      - ./ops/local/storage:/opt/storage:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
