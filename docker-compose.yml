name: social-core
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_core}
      POSTGRES_USER: ${POSTGRES_USER:-social_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
  app:
    profiles: [app]
    build: .
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-social_core}
      DB_USERNAME: ${POSTGRES_USER:-social_core}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      SPRING_PROFILES_ACTIVE: local
      SMTP_HOST: mailpit
      AUTH_PRIVATE_KEY_FILE: /run/secrets/signing-private.pem
      AUTH_PUBLIC_KEY_FILE: /run/secrets/signing-public.pem
      MAIL_ENCRYPTION_KEY_FILE: /run/secrets/mail.b64
      LIMITER_KEY_FILE: /run/secrets/limiter.b64
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./.local/secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DISABLE_VERSION_CHECK: "true"
volumes:
  postgres-data:
