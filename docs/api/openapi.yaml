            - "ACTIVE"
            - "ARCHIVED"
        "ownerId":
          "type":
            - "string"
            - "null"
          "format": "uuid"
        "version":
          "type": "integer"
          "minimum": 0
    "CommunityCreate":
      "type": "object"
      "additionalProperties": false
