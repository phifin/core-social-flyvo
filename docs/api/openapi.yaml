        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [action, reason], properties: {action: {type: string, enum: [REMOVE_CONTENT, RESTORE_CONTENT]}, reason: {type: string, minLength: 1, maxLength: 2000}}}}}}
      responses:
        '200': {description: Action committed with post ETag, content: {application/json: {schema: {type: object, additionalProperties: false, required: [actionId, version, status], properties: {actionId: {type: string, format: uuid}, version: {type: integer, minimum: 0}, status: {type: string, enum: [PUBLISHED, REMOVED]}}}}}}
