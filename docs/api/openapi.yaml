        "joinMode":
          "enum":
            - "OPEN"
            - "REQUEST"
            - "INVITE_ONLY"
          "default": "INVITE_ONLY"
    "CommunitySettings":
      "type": "object"
      "additionalProperties": false
      "required":
        []
      "properties":
        "name":
          "type":
            - "string"
            - "null"
          "minLength": 1
          "maxLength": 120
        "description":
          "type":
            - "string"
            - "null"
          "maxLength": 4000
        "visibility":
          "enum":
            - "PUBLIC"
            - "PRIVATE"
            - null
        "joinMode":
          "enum":
            - "OPEN"
            - "REQUEST"
            - "INVITE_ONLY"
            - null
    "CommunityUser":
      "type": "object"
