        SUPPORT: {type: integer, minimum: 0}
        INSIGHTFUL: {type: integer, minimum: 0}
    ReactionPage:
      type: object
      additionalProperties: false
      required: [counts, items, nextCursor]
      properties:
        counts: {$ref: '#/components/schemas/ReactionCounts'}
        items:
          type: array
          items:
