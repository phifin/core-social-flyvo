      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "user"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "204":
          "description": "Remove friendship, no implicit follow changes"
