  /api/v1/posts:
    get:
      operationId: listPosts
      summary: Bounded current-policy query, not a home feed
      security: [{BearerAuth: []}, {}]
      description: "At most one author/community filter. Order publishedAt DESC, UUID DESC. Encrypted 15-minute cursor binds actor, filters and asOf; size 1–100. Each page rechecks current sources. Empty filtered pages may still have a cursor. No counts or signed URLs."
      parameters:
        - {name: authorId, in: query, schema: {type: string, format: uuid}}
        - {name: communityId, in: query, schema: {type: string, format: uuid}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {type: string, maxLength: 4096}}
      responses:
        '200': {description: Current visible posts, content: {application/json: {schema: {$ref: '#/components/schemas/PostPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: publishPost
      summary: Atomically bind zero to ten owned READY images and publish
      security: [{BearerAuth: []}]
      description: "Requires active account, current community write authority if scoped and unblocked active participants. Nonempty plain text, unfetched HTTP(S) link or images. CUSTOM has 1–100 fixed recipients excluding author. Optional 24-hour logical idempotency, not cached response. Replay reauthorizes. Maximum JSON body 256 KiB."
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostPublish'}}}}
      responses:
        '201': {description: Published with Location and quoted version ETag, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/posts/{id}:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    get:
      operationId: getPost
      summary: Read using current audience, account, block and community facts
      security: [{BearerAuth: []}, {}]
      responses:
        '200': {description: Private no-store representation with version ETag, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: editPost
      summary: Owner-only versioned body, mention and attachment replacement
      security: [{BearerAuth: []}]
      description: "Audience is a separate command. Missing If-Match is 428, stale is 412. publishedAt never changes; editedAt and immutable revision advance. Removed attachments remain private history for 30 days, cannot be rebound."
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostEdit'}}}}
      responses:
        '200': {description: Updated with ETag, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deletePost
      summary: Versioned owner soft deletion, including blind deletion after departure
      security: [{BearerAuth: []}]
      description: "Owner may delete without reading departed-community content. Archive still denies writes. Author deletion takes precedence over moderation restore. Immediately denies history/media issuance; retention redacts after 30 days."
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '204': {description: Soft deleted}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/posts/{id}/audience:
    put:
      operationId: changePostAudience
      summary: Explicit audited versioned audience change
      security: [{BearerAuth: []}]
      description: "Current authority and participants rechecked. COMMUNITY cannot become a personal audience. Widening is attributable and audited; next reads/history/media use the new audience."
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostAudience'}}}}
      responses:
        '200': {description: Updated with ETag, content: {application/json: {schema: {$ref: '#/components/schemas/Post'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/posts/{id}/revisions:
    get:
      operationId: listPostRevisions
      summary: Private retained history, author or current effective community moderator
      security: [{BearerAuth: []}]
      description: "Requires current ordinary post visibility as well as history authority. Staff history reads are audited. Immutable snapshots do not grant historical permissions. Descending revision ordinal, 30-day retention. nextCursor is a revision ordinal to pass as before (not the post-list cursor)."
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: before, in: query, schema: {type: integer, minimum: 1, default: 2147483647}}
      responses:
        '200': {description: Private retained history, content: {application/json: {schema: {$ref: '#/components/schemas/PostRevisionPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/posts/{id}/media/{media}/access:
    post:
      operationId: issuePostImageAccess
      summary: Source-authorized pinned processed variants, never originals
      security: [{BearerAuth: []}, {}]
      description: "Current post policy authorizes each issuance; inaccessible or wrong context is 404. Optional revision requires retained author/staff history authority. No uploader bypass. URL is a reusable bearer capability for at most 60 seconds; previous bytes cannot be revoked. Cache-Control private, no-store."
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {name: media, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: revision, in: query, schema: {type: integer, minimum: 1}}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '200': {description: Two current generation variants, content: {application/json: {schema: {$ref: '#/components/schemas/ImageVariants'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/media/uploads:
    post:
      operationId: requestImageUpload
      summary: Reserve per-owner quota and create a private upload intent
      security: [{BearerAuth: []}]
      description: "Server generates ID/key. Direct PUT capability expires within 10 minutes and never past the intent's 15-minute TTL. All returned headers are required; client retains x-amz-version-id for finalize. MIME, declared size and SHA-256 are signed. Initial 10/min, 100 MiB pending, 1 GiB total accounting, configurable. 503 STORAGE_DISABLED when local storage is not enabled. Original filenames/keys/URLs and owner fields are not inputs."
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImageUpload'}}}}
      responses:
        '201': {description: Private no-store intent with Location, content: {application/json: {schema: {$ref: '#/components/schemas/ImageUploadIntent'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/media/{id}/finalize:
    post:
      operationId: finalizeImageUpload
      summary: Inspect pinned upload version outside locks and enqueue processing atomically
      security: [{BearerAuth: []}]
      description: "Owner-only. Same verified version is idempotent; different version is 409. Metadata mismatch, absent version, expiration or invalid state never schedules READY. Processing is asynchronous."
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [versionId], properties: {versionId: {type: string, minLength: 1, maxLength: 256}}}}}}
      responses:
        '202': {description: Status with Location, content: {application/json: {schema: {$ref: '#/components/schemas/ImageStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/media/{id}:
    parameters:
      - {$ref: '#/components/parameters/PostId'}
    get:
      operationId: getOwnedImageStatus
      summary: Owner-only metadata status, no key, original or bound download URL
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Metadata only, content: {application/json: {schema: {$ref: '#/components/schemas/ImageStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteUnboundImage
      summary: Owner claims unbound asset for durable all-version deletion
      security: [{BearerAuth: []}]
      description: "Bound or processing assets cannot be deleted through the uploader path. DELETING/DELETED replay is idempotent. Issuance and binding are denied immediately; accounting releases only after upload intent expiry plus fifteen-minute settling and confirmed all-version purge. Durable reconciliation repurges exceptional late upload completions; deletion scheduling is not synchronous byte erasure."
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Deletion scheduled or already deleted}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/avatar:
    put:
      operationId: replaceAvatar
      summary: Versioned profile command atomically binds AVATAR and releases prior image
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {mediaId: {type: [string, 'null'], format: uuid, description: Null or omitted removes avatar}}}}}}
      responses:
        '200': {description: Current profile with ETag, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/users/{id}/avatar/access:
    post:
      operationId: issueAvatarAccess
