          "pattern": "^[a-z0-9][a-z0-9-]{2,79}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 120
        "description":
          "type": "string"
          "maxLength": 4000
        "visibility":
          "enum":
            - "PUBLIC"
            - "PRIVATE"
