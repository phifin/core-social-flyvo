            additionalProperties: false
            required: [actorId, displayName, type]
            properties:
              actorId: {type: string, format: uuid}
              displayName: {type: string}
              type: {$ref: '#/components/schemas/ReactionType'}
        nextCursor: {type: [string, 'null']}
    GraphTarget:
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
    FriendRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "requesterId"
        - "addresseeId"
        - "status"
        - "expiresAt"
        - "version"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "requesterId":
          "type": "string"
          "format": "uuid"
        "addresseeId":
          "type": "string"
          "format": "uuid"
        "status":
          "enum":
            - "PENDING"
            - "ACCEPTED"
            - "DECLINED"
            - "CANCELLED"
            - "EXPIRED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "version":
          "type": "integer"
          "minimum": 0
    GraphUserPage:
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "nextCursor"
      "properties":
        "items":
          "type": "array"
          "maxItems": 100
          "items":
            "type": "string"
            "format": "uuid"
        "nextCursor":
          "type":
            - "string"
            - "null"
      "description": "UUID-ascending keyset page. Authenticated encrypted cursor binds viewer, owner and list for 15 minutes; send as after. Continue until nextCursor is null, even on an empty filtered page. No totals or snapshot promise."
    FriendRequestPage:
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "nextCursor"
      "properties":
        "items":
          "type": "array"
          "maxItems": 100
          "items":
            "$ref": "#/components/schemas/FriendRequest"
        "nextCursor":
          "type":
            - "string"
            - "null"
      "description": "Same cursor rules as GraphUserPage; ascending request UUID, current pending/expiry/account/block filtering."
