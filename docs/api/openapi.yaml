      responses:
        '200':
          description: Nonblocking SSE, no-store, closes at actual expiry
          content:
            text/event-stream:
              schema: {type: string}
        '429':
          description: Stream cap or rate budget exhausted
          headers:
            Retry-After: {schema: {type: integer}, description: Five seconds for stream caps, sixty for rate budget}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notifications/{id}/read:
    put:
      operationId: readNotification
      summary: Advance readVersion through observed activityVersion
      security: [{BearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [activityVersion], properties: {activityVersion: {type: integer, format: int64, minimum: 0}}}
      responses:
        '204': {description: Observed activity marked read; future/new activity remains unread}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/notifications/read:
    post:
      operationId: readAllNotifications
      summary: Mark server-observed eligible versions read
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Observed snapshot read; concurrent new activity remains unread}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Recipient per-kind in-app settings
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Explicit settings, defaults enabled, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: changeNotificationPreferences
      summary: Atomically set selected in-app kinds
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}
      responses:
        '200': {description: Current complete settings; security email unaffected, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/search/users:
    get:
      operationId: searchUsers
      summary: Source-authorized user name/handle discovery
      security: [{BearerAuth: []}]
      description: Plain NFC/lowercase terms, 1..8 words containing letters/digits. Simple PostgreSQL tokenization, no accent folding/stemming/operator language. Exact/prefix normalized handles/names supplement full-text matching. Current account/profile scope/bilateral blocks apply before names. Thirty requests/minute per user/IP; rate denial is 429/Retry-After60. No hidden total or projection-text fallback. Opaque cursor binds viewer/query/type/filter/size/cutoff, expires30 minutes; updates may omit results until refresh, and bounded refill may return empty continued pages.
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - {$ref: '#/components/parameters/SearchSize'}
        - {$ref: '#/components/parameters/SearchAfter'}
      responses:
        '200': {description: Currently eligible cards, content: {application/json: {schema: {$ref: '#/components/schemas/SearchUsersPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/search/communities:
    get:
      operationId: searchCommunities
      summary: Current authenticated community discovery cards
      security: [{BearerAuth: []}]
      description: Same bounded plain-query/rate/cursor contract as user search. Existing private community name/description discovery cards do not grant post/member access. Archived communities are omitted. Snippets contain at most240 Unicode code points from current owner data, never stored projection text.
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - {$ref: '#/components/parameters/SearchSize'}
        - {$ref: '#/components/parameters/SearchAfter'}
      responses:
        '200': {description: Authorized discovery cards, content: {application/json: {schema: {$ref: '#/components/schemas/SearchCommunitiesPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/search/posts:
    get:
      operationId: searchPosts
      summary: Source-authorized simple full-text post discovery
      security: [{BearerAuth: []}]
      description: Same bounded plain-query/rate/cursor contract; no body wildcard matching. Current source body and policy share the owner's statement. Index staleness never grants audience/member/account/block access. Optional communityId is cursor-bound and currently scope-authorized even for an empty page. Snippet is at most240 Unicode code points of authorized current plain text; no stale highlights, stored text fallback, score or hidden total. Mute retains existing home-only semantics.
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - {$ref: '#/components/parameters/SearchSize'}
        - {$ref: '#/components/parameters/SearchAfter'}
        - {name: communityId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized current post snippets, content: {application/json: {schema: {$ref: '#/components/schemas/SearchPostsPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/search/rebuilds:
    post:
      operationId: startSearchRebuild
      summary: Current ADMIN starts or resumes an audited bounded rebuild
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/Csrf'}
      description: EXPORT then RECONCILE in100-source fenced jobs; versioned owner snapshots and checksums, not raw event bodies. New rebuild omits resumeId/expectedVersion. Resume requires both and matching current version/kind; stale is412, completed/active-kind conflict409. No raw exports exposed. This is not a frozen cross-source snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [USER, COMMUNITY, POST]}
                resumeId: {type: [string, 'null'], format: uuid}
                expectedVersion: {type: [integer, 'null'], minimum: 0}
      responses:
        '202': {description: Audited rebuild scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/SearchRebuild'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/admin/search/rebuilds/{id}:
    get:
      operationId: readSearchRebuild
      summary: Attributable current ADMIN rebuild status
      security: [{BearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Audited operator-only progress, content: {application/json: {schema: {$ref: '#/components/schemas/SearchRebuild'}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    RefreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "refresh"
      description: "Host-only Secure HttpOnly SameSite=Strict; Path=/api/v1/auth. Local localhost profile alone allows HTTP."
  parameters:
    SearchQuery:
      name: q
      in: query
      required: true
      schema: {type: string, minLength: 2, maxLength: 200}
    SearchSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    SearchAfter:
      name: after
      in: query
      schema: {type: string, maxLength: 4096}
    CommentId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    InteractionSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    InteractionAfter:
      name: after
      in: query
      schema: {type: string, maxLength: 4096}
    PostId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[0-9]{1,18}"$'
      description: Strong quoted community or target membership version; missing is 428, stale is 412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional printable ASCII key; actor and route scoped for 24 hours; logical references only.
    Origin:
      name: "Origin"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uri"
      description: "Exact configured trusted frontend origin; no wildcard credentials."
    Csrf:
      name: "X-XSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Get token and XSRF-TOKEN cookie from /auth/csrf; send cookie plus header with credentials."
  responses:
    Health:
      description: "Minimal Actuator status, no component details."
      content:
        "application/vnd.spring-boot.actuator.v3+json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "status"
            properties:
              status:
                type: "string"
                enum:
                  - "UP"
                  - "DOWN"
                  - "OUT_OF_SERVICE"
                  - "UNKNOWN"
              groups:
                type: "array"
                items:
                  type: "string"
    Problem:
      description: "Sanitized Problem Details. 400 invalid input; 401 invalid/missing proof/authentication; 403 denial/CSRF/Origin; 404 missing/inaccessible; 409 unique/lifecycle conflict; 412 stale version; 413 body >16 KiB; 428 missing version; 429 bounded throttle (+Retry-After); 503 dependency/provider/hash capacity unavailable."
      headers:
        X-Request-ID:
          schema:
            type: "string"
        Retry-After:
          schema:
            type: "integer"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    SearchUser:
      type: object
      required: [id, handle, name, version]
      properties:
        id: {type: string, format: uuid}
        handle: {type: string}
        name: {type: string}
        version: {type: integer, format: int64}
    SearchCommunity:
      type: object
      required: [id, slug, name, snippet, visibility, version]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        snippet: {type: string, maxLength: 240}
        visibility: {type: string, enum: [PUBLIC, PRIVATE]}
        version: {type: integer, format: int64}
    SearchPost:
      type: object
      required: [id, authorId, displayName, communityId, snippet, publishedAt, version]
      properties:
        id: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        displayName: {type: [string, 'null']}
        communityId: {type: [string, 'null'], format: uuid}
        snippet: {type: string, maxLength: 240}
        publishedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
    SearchUsersPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/SearchUser'}}
        nextCursor: {type: [string, 'null']}
    SearchCommunitiesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/SearchCommunity'}}
        nextCursor: {type: [string, 'null']}
    SearchPostsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/SearchPost'}}
        nextCursor: {type: [string, 'null']}
    SearchRebuild:
      type: object
      required: [id, kind, stage, version, examined, changed, createdAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [USER, COMMUNITY, POST]}
        stage: {type: string, enum: [EXPORT, RECONCILE, DONE]}
        version: {type: integer, format: int64}
        examined: {type: integer, format: int64}
        changed: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    NotificationKind:
      type: string
      enum: [FRIEND_REQUEST, FRIENDSHIP_ACCEPTED, COMMUNITY_INVITATION, COMMENT_ON_POST, REPLY_TO_COMMENT, MENTION, REACTION_ON_CONTENT]
    NotificationItem:
      type: object
      required: [id, kind, targetType, targetId, activityVersion, readVersion, lastActivityAt, actorCount, actors]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/NotificationKind'}
        targetType: {type: string, enum: [POST, COMMENT, FRIEND_REQUEST, COMMUNITY_INVITATION]}
        targetId: {type: string, format: uuid}
        activityVersion: {type: integer, format: int64, minimum: 1}
        readVersion: {type: integer, format: int64, minimum: 0}
        lastActivityAt: {type: string, format: date-time}
        actorCount: {type: integer, format: int64, minimum: 1}
        actors:
          type: array
          maxItems: 3
          items: {type: object, required: [userId, displayName], properties: {userId: {type: string, format: uuid}, displayName: {type: string}}}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [inApp]
      properties:
        inApp:
          type: object
          minProperties: 1
          maxProperties: 7
          propertyNames: {$ref: '#/components/schemas/NotificationKind'}
          additionalProperties: {type: boolean}
    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/FeedItem'}}
        nextCursor: {type: [string, 'null']}
    FeedItem:
      type: object
      required: [post, engagement]
      properties:
        post: {$ref: '#/components/schemas/Post'}
        engagement:
          oneOf:
            - {$ref: '#/components/schemas/FeedEngagement'}
            - {type: 'null'}
    FeedEngagement:
      type: object
      required: [comments, reactions]
      properties:
        comments: {type: integer, minimum: 0}
        reactions: {type: object, additionalProperties: {type: integer, minimum: 0}}
      description: Viewer-filtered current optional display data, never authorization. Null if the parent becomes inaccessible after its coherent authorized body read.
    ReportTarget:
      type: string
      enum: [POST, COMMENT, COMMUNITY, USER]
    ReportCategory:
      type: string
      enum: [SPAM, HARASSMENT, HATE, VIOLENCE, SEXUAL_CONTENT, OTHER]
    ReportSubmit:
      type: object
      additionalProperties: false
      required: [targetType, targetId, category]
      properties:
        targetType: {$ref: '#/components/schemas/ReportTarget'}
        targetId: {type: string, format: uuid}
        category: {$ref: '#/components/schemas/ReportCategory'}
        detail: {type: [string, 'null'], maxLength: 4000}
      description: No reporter, scope, status, role or evidence fields. Evidence is owner-captured and encrypted, summary capped at 2000 code points; detail is encrypted with it. USER scope is always global. JSON capped at 64 KiB.
    Report:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, communityId, category, status, createdAt, resolvedAt, version]
      properties:
        id: {type: string, format: uuid}
        targetType: {$ref: '#/components/schemas/ReportTarget'}
        targetId: {type: string, format: uuid}
        communityId: {type: [string, 'null'], format: uuid}
        category: {$ref: '#/components/schemas/ReportCategory'}
        status: {type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED]}
        createdAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 0}
    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Report'}}
        nextCursor: {type: 'null'}
      description: Bounded administration offset page, newest-first time/UUID; no totals or snapshot. Caller explicitly advances offset.
    ReportEvidence:
      type: object
      required: [report, detail, capturedAt, summary, redacted]
      properties:
        report: {$ref: '#/components/schemas/Report'}
        detail: {type: [string, 'null'], maxLength: 4000}
        capturedAt: {type: [string, 'null'], format: date-time}
        summary: {type: [string, 'null'], maxLength: 2000}
        redacted: {type: boolean}
      description: Only current scoped staff or platform ADMIN global case endpoints; every successful read is audited. Not ordinary target authority. Survives source deletion; no media URLs or raw objects.
    CaseView:
      type: object
      required: [id, targetType, targetId, communityId, category, status, createdAt, resolvedAt, version, assignedTo, holdUntil, holdReason, retentionState]
      properties:
        id: {type: string, format: uuid}
        targetType: {$ref: '#/components/schemas/ReportTarget'}
        targetId: {type: string, format: uuid}
        communityId: {type: [string, 'null'], format: uuid}
        category: {$ref: '#/components/schemas/ReportCategory'}
        status: {type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED]}
        createdAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 0}
        assignedTo: {type: [string, 'null'], format: uuid}
        holdUntil: {type: [string, 'null'], format: date-time}
        holdReason: {type: [string, 'null'], maxLength: 64}
        retentionState: {type: string, enum: [NONE, STARTED, DONE]}
      description: Staff-only queue/assignment metadata; existing flat report fields preserved. Assignment never grants authority. Hold expires by database time and is unrelated to assignee changes.
    CasePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CaseView'}}
        nextCursor: {type: 'null'}
    CaseAssignment:
      type: object
      additionalProperties: false
      properties:
        assignedTo: {type: [string, 'null'], format: uuid}
      description: Null unassigns. Current eligible staff in immutable scope only; terminal cases reject assignment; current case If-Match required.
    ModerationHold:
      type: object
      additionalProperties: false
      properties:
        expiresAt: {type: [string, 'null'], format: date-time}
        reasonCode: {type: [string, 'null'], pattern: '^[A-Z_]{1,64}$'}
      description: Explicit engineering hold, not a legal product. Expiry must be after DB now and at most365 days ahead. Both null release. Current scoped staff/global ADMIN and root If-Match required; renewal is explicit. STARTED/DONE rejects new/renewed holds, no resurrection. Archived scope may retain evidence under current staff read authority. Linked actions use case root, never independent action hold.
    ModerationControl:
      type: object
      required: [type, id, version, holdUntil, holdReason, retentionState]
      properties:
        type: {type: string, enum: [REPORT, ACTION]}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 0}
        holdUntil: {type: [string, 'null'], format: date-time}
        holdReason: {type: [string, 'null'], maxLength: 64}
        retentionState: {type: string, enum: [NONE, STARTED, DONE]}
    CaseHistoryEntry:
      type: object
      required: [id, caseVersion, actorId, operation, actionId, assignedTo, holdUntil, createdAt, redacted, reason, beforeState, afterState]
      properties:
        id: {type: string, format: uuid}
        caseVersion: {type: [integer, 'null'], minimum: 0}
        actorId: {type: [string, 'null'], format: uuid}
        operation: {type: string, maxLength: 40}
        actionId: {type: [string, 'null'], format: uuid}
        assignedTo: {type: [string, 'null'], format: uuid}
        holdUntil: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        redacted: {type: boolean}
        reason: {type: [string, 'null'], maxLength: 2000}
        beforeState: {type: [string, 'null'], maxLength: 65536}
        afterState: {type: [string, 'null'], maxLength: 65536}
      description: Old action versions are unknown/null, not fabricated. System retention entries have null actor. Before/after are private JSON-encoded strings. Redaction returns null private fields, never fallback source data.
    CaseHistory:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CaseHistoryEntry'}}
      description: Oldest-first createdAt/UUID, size20/default100/max, offset0..10000, no total/snapshot. Every successful read is scoped/audited in its transaction.
    ModerationActionView:
      type: object
      required: [id, reportId, actorId, communityId, targetType, targetId, action, createdAt, redacted, reason, beforeState, afterState, control]
      properties:
        id: {type: string, format: uuid}
        reportId: {type: [string, 'null'], format: uuid}
        actorId: {type: string, format: uuid}
        communityId: {type: [string, 'null'], format: uuid}
        targetType: {type: string, enum: [REPORT, POST, COMMENT, MEMBER, ACCOUNT]}
        targetId: {type: string, format: uuid}
        action: {type: string, maxLength: 32}
        createdAt: {type: string, format: date-time}
        redacted: {type: boolean}
        reason: {type: [string, 'null'], maxLength: 2000}
        beforeState: {type: [string, 'null'], maxLength: 65536}
        afterState: {type: [string, 'null'], maxLength: 65536}
        control: {$ref: '#/components/schemas/ModerationControl'}
    AccountModerationRequest:
      description: Obtain the target source version through the audited ADMIN account-state read. Role/owner/actor are not input fields.
      type: object
      additionalProperties: false
      required: [userId, action, reasonCode]
      properties:
        userId: {type: string, format: uuid}
        action: {type: string, enum: [SUSPEND_ACCOUNT, REINSTATE_ACCOUNT]}
        reasonCode: {type: string, pattern: '^[A-Z_]{1,64}$'}
    AccountModerationResult:
      type: object
      required: [actionId, account]
      properties:
        actionId: {type: string, format: uuid}
        account:
          type: object
          required: [userId, before, after, version]
          properties:
            userId: {type: string, format: uuid}
            before: {type: string, enum: [ACTIVE, SUSPENDED]}
            after: {type: string, enum: [ACTIVE, SUSPENDED]}
            version: {type: integer, minimum: 0}
    ModerationAccountState:
      type: object
      required: [userId, status, platformRole, version]
      properties:
        userId: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, SUSPENDED, DELETION_PENDING, PENDING_VERIFICATION, DELETED]}
        platformRole: {type: string, enum: [USER, ADMIN]}
        version: {type: integer, minimum: 0}
    ModerationProgress:
      type: object
      required: [legacyPayloads, pendingCaseRoots, pendingActionRoots]
      properties:
        legacyPayloads: {type: integer, minimum: 0}
        pendingCaseRoots: {type: integer, minimum: 0}
        pendingActionRoots: {type: integer, minimum: 0}
      description: Restricted operational counts, not user discovery totals. Pending roots mean partial STARTED work. Resume enqueues a new bounded durable pass, never weakens a guard or deletes DEAD history.
    ReportAction:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: {type: string, enum: [REVIEW_REPORT, RESOLVE_REPORT, DISMISS_REPORT, REMOVE_CONTENT, RESTORE_CONTENT, SUSPEND_MEMBER, BAN_MEMBER, UNBAN_MEMBER]}
        reason: {type: string, minLength: 1, maxLength: 2000}
        sourceVersion: {type: [integer, 'null'], minimum: 0}
        suspendedUntil: {type: [string, 'null'], format: date-time}
      description: If-Match is case version. Content/member actions also require sourceVersion. Sanction acts on immutable reported content author, current hierarchy applies. Global endpoints only review/resolve/dismiss. Restore cannot undo author deletion. No implicit command retry.
    ReportResult:
      type: object
      required: [actionId, report]
      properties:
        actionId: {type: string, format: uuid}
        report: {$ref: '#/components/schemas/Report'}
    CommentText:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 5000, description: Plain text; whitespace-only is invalid}
    Comment:
      type: object
      additionalProperties: false
      required: [id, postId, rootId, authorId, displayName, replyToUserId, body, tombstone, createdAt, editedAt, version]
      properties:
        id: {type: string, format: uuid}
        postId: {type: string, format: uuid}
        rootId: {type: [string, 'null'], format: uuid}
        authorId: {type: [string, 'null'], format: uuid}
        displayName: {type: [string, 'null']}
        replyToUserId: {type: [string, 'null'], format: uuid}
        body: {type: [string, 'null'], maxLength: 5000}
        tombstone: {type: boolean}
        createdAt: {type: string, format: date-time}
        editedAt: {type: [string, 'null'], format: date-time}
        version: {type: [integer, 'null'], minimum: 0}
      description: Tombstones expose only root ID, post ID, chronological position and tombstone=true; all author/text/edit/version/reply context fields are null.
    CommentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Comment'}}
        nextCursor: {type: [string, 'null']}
    ReactionType:
      type: string
      enum: [LIKE, LOVE, CELEBRATE, SUPPORT, INSIGHTFUL]
    ReactionInput:
      type: object
