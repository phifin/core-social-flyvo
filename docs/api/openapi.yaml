        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "204":
          "description": "Mute another user; repeated same state is a no-op"
        "default":
          "$ref": "#/components/responses/Problem"
    "delete":
      "operationId": "deleteMute"
      "summary": "Remove mute; idempotent, no relationships restored"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "user"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "204":
          "description": "Remove mute; idempotent, no relationships restored"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/me/friends/{user}":
    "delete":
      "operationId": "unfriend"
