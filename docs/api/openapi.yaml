          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "kind"
          "in": "path"
          "required": true
          "schema":
            "enum":
              - "following"
              - "followers"
              - "friends"
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "after"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 256
      "responses":
        "200":
          "description": "Require current profile visibility; blocks deny; no private block/mute lists"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GraphUserPage"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/friend-requests":
    "post":
      "operationId": "requestFriendship"
      "summary": "Create pending request or return same-direction pending request; opposite direction conflicts"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "200":
          "description": "Create pending request or return same-direction pending request; opposite direction conflicts"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FriendRequest"
        "default":
          "$ref": "#/components/responses/Problem"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GraphTarget"
  "/api/v1/friend-requests/{id}/accept":
    "post":
      "operationId": "acceptFriendRequest"
      "summary": "Addressee accepts pending request; current actor and block checks on retries"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "200":
          "description": "Addressee accepts pending request; current actor and block checks on retries"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FriendRequest"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/friend-requests/{id}/decline":
    "post":
      "operationId": "declineFriendRequest"
      "summary": "Addressee declines pending request; current actor and block checks on retries"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "200":
          "description": "Addressee declines pending request; current actor and block checks on retries"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FriendRequest"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/friend-requests/{id}/cancel":
    "post":
      "operationId": "cancelFriendRequest"
      "summary": "Requester cancels pending request"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "$ref": "#/components/parameters/Origin"
        -
          "$ref": "#/components/parameters/Csrf"
      "responses":
        "200":
          "description": "Requester cancels pending request"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FriendRequest"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/me/friend-requests":
    "get":
      "operationId": "listFriendRequests"
      "summary": "Own live pending requests; expired, blocked and inactive counterparts filtered"
      "security":
        -
          "BearerAuth": []
      "parameters":
        -
          "name": "direction"
          "in": "query"
          "required": false
          "schema":
            "enum":
              - "incoming"
              - "outgoing"
            "default": "incoming"
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "after"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 256
      "responses":
        "200":
          "description": "Own live pending requests; expired, blocked and inactive counterparts filtered"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FriendRequestPage"
        "default":
          "$ref": "#/components/responses/Problem"
components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    RefreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "refresh"
      description: "Host-only Secure HttpOnly SameSite=Strict; Path=/api/v1/auth. Local localhost profile alone allows HTTP."
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[0-9]{1,18}"$'
      description: Strong quoted community or target membership version; missing is 428, stale is 412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional printable ASCII key; actor and route scoped for 24 hours; logical references only.
    Origin:
      name: "Origin"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uri"
      description: "Exact configured trusted frontend origin; no wildcard credentials."
    Csrf:
      name: "X-XSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Get token and XSRF-TOKEN cookie from /auth/csrf; send cookie plus header with credentials."
  responses:
    Health:
      description: "Minimal Actuator status, no component details."
      content:
        "application/vnd.spring-boot.actuator.v3+json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "status"
            properties:
              status:
                type: "string"
                enum:
                  - "UP"
                  - "DOWN"
                  - "OUT_OF_SERVICE"
                  - "UNKNOWN"
              groups:
                type: "array"
                items:
                  type: "string"
    Problem:
      description: "Sanitized Problem Details. 400 invalid input; 401 invalid/missing proof/authentication; 403 denial/CSRF/Origin; 404 missing/inaccessible; 409 unique/lifecycle conflict; 412 stale version; 413 body >16 KiB; 428 missing version; 429 bounded throttle (+Retry-After); 503 dependency/provider/hash capacity unavailable."
      headers:
        X-Request-ID:
          schema:
            type: "string"
        Retry-After:
          schema:
            type: "integer"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    GraphTarget:
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
    FriendRequest:
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "requesterId"
        - "addresseeId"
        - "status"
        - "expiresAt"
        - "version"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "requesterId":
          "type": "string"
          "format": "uuid"
        "addresseeId":
          "type": "string"
          "format": "uuid"
        "status":
          "enum":
            - "PENDING"
            - "ACCEPTED"
            - "DECLINED"
            - "CANCELLED"
            - "EXPIRED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "version":
          "type": "integer"
          "minimum": 0
    GraphUserPage:
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "nextCursor"
      "properties":
        "items":
          "type": "array"
          "maxItems": 100
          "items":
            "type": "string"
            "format": "uuid"
        "nextCursor":
          "type":
            - "string"
            - "null"
      "description": "UUID-ascending keyset page. Authenticated encrypted cursor binds viewer, owner and list for 15 minutes; send as after. Continue until nextCursor is null, even on an empty filtered page. No totals or snapshot promise."
    FriendRequestPage:
      "type": "object"
      "additionalProperties": false
      "required":
        - "items"
        - "nextCursor"
      "properties":
        "items":
          "type": "array"
          "maxItems": 100
          "items":
            "$ref": "#/components/schemas/FriendRequest"
        "nextCursor":
          "type":
            - "string"
            - "null"
      "description": "Same cursor rules as GraphUserPage; ascending request UUID, current pending/expiry/account/block filtering."
    "Community":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "slug"
        - "name"
        - "description"
        - "visibility"
        - "status"
        - "version"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "slug":
          "type": "string"
          "maxLength": 80
        "name":
          "type": "string"
          "maxLength": 120
        "description":
          "type": "string"
          "maxLength": 4000
        "visibility":
          "enum":
            - "PUBLIC"
            - "PRIVATE"
        "joinMode":
          "enum":
            - "OPEN"
            - "REQUEST"
            - "INVITE_ONLY"
            - null
        "status":
          "enum":
            - "ACTIVE"
            - "ARCHIVED"
        "ownerId":
          "type":
            - "string"
            - "null"
          "format": "uuid"
        "version":
          "type": "integer"
          "minimum": 0
    "CommunityCreate":
      "type": "object"
      "additionalProperties": false
      "required":
        - "slug"
        - "name"
      "properties":
        "slug":
          "type": "string"
          "pattern": "^[a-z0-9][a-z0-9-]{2,79}$"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 120
        "description":
          "type": "string"
          "maxLength": 4000
        "visibility":
          "enum":
            - "PUBLIC"
            - "PRIVATE"
          "default": "PRIVATE"
        "joinMode":
          "enum":
            - "OPEN"
            - "REQUEST"
            - "INVITE_ONLY"
          "default": "INVITE_ONLY"
    "CommunitySettings":
      "type": "object"
      "additionalProperties": false
      "required":
        []
      "properties":
        "name":
          "type":
            - "string"
            - "null"
          "minLength": 1
          "maxLength": 120
        "description":
          "type":
            - "string"
            - "null"
          "maxLength": 4000
        "visibility":
          "enum":
            - "PUBLIC"
            - "PRIVATE"
            - null
        "joinMode":
          "enum":
            - "OPEN"
            - "REQUEST"
            - "INVITE_ONLY"
            - null
    "CommunityUser":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
    "CommunityRole":
      "type": "object"
      "additionalProperties": false
      "required":
        - "role"
      "properties":
        "role":
          "enum":
            - "MEMBER"
            - "MODERATOR"
            - "ADMIN"
    "Membership":
      "type": "object"
      "additionalProperties": false
      "required":
        - "communityId"
        - "userId"
        - "role"
        - "status"
        - "version"
      "properties":
        "communityId":
          "type": "string"
          "format": "uuid"
        "userId":
          "type": "string"
          "format": "uuid"
        "role":
          "enum":
            - "OWNER"
            - "ADMIN"
            - "MODERATOR"
            - "MEMBER"
        "status":
          "enum":
            - "ACTIVE"
            - "LEFT"
            - "REMOVED"
            - "BANNED"
        "suspendedUntil":
          "type":
            - "string"
            - "null"
          "format": "date-time"
        "version":
          "type": "integer"
          "minimum": 0
    "CommunityInvitation":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "communityId"
        - "inviteeId"
        - "inviterId"
        - "status"
        - "expiresAt"
        - "version"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "communityId":
          "type": "string"
          "format": "uuid"
        "inviteeId":
          "type": "string"
          "format": "uuid"
        "inviterId":
          "type": "string"
          "format": "uuid"
        "status":
          "enum":
            - "PENDING"
            - "ACCEPTED"
            - "DECLINED"
            - "REVOKED"
            - "EXPIRED"
        "expiresAt":
          "type": "string"
          "format": "date-time"
        "version":
          "type": "integer"
          "minimum": 0
    "CommunityJoinRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "communityId"
        - "userId"
        - "status"
        - "version"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "communityId":
          "type": "string"
          "format": "uuid"
        "userId":
          "type": "string"
          "format": "uuid"
        "status":
          "enum":
            - "PENDING"
            - "APPROVED"
            - "REJECTED"
            - "CANCELLED"
        "message":
          "type":
            - "string"
            - "null"
          "maxLength": 1000
        "version":
          "type": "integer"
          "minimum": 0
    "CommunityRequestMessage":
      "type": "object"
      "additionalProperties": false
      "required":
        []
      "properties":
        "message":
          "type":
            - "string"
            - "null"
          "maxLength": 1000
    "MemberModerationAction":
      "type": "object"
      "additionalProperties": false
      "required":
        - "userId"
        - "action"
        - "reason"
      "properties":
        "userId":
          "type": "string"
          "format": "uuid"
        "action":
          "enum":
            - "SUSPEND_MEMBER"
            - "BAN_MEMBER"
            - "UNBAN_MEMBER"
        "reason":
          "type": "string"
          "minLength": 1
          "maxLength": 2000
        "suspendedUntil":
          "type":
            - "string"
            - "null"
          "format": "date-time"
    "MemberModerationResult":
      "type": "object"
      "additionalProperties": false
      "required":
        - "id"
        - "membership"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "membership":
          "$ref": "#/components/schemas/Membership"
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
        - "requestId"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
        code:
          type: "string"
        requestId:
          type: "string"
        violations:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
              - "message"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
    Email:
      type: "object"
      additionalProperties: false
      required:
        - "email"
      properties:
        email:
          type: "string"
          maxLength: 320
          format: "email"
    RegistrationCompletion:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        password:
          type:
            - "string"
            - "null"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Login:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          maxLength: 320
        password:
          type: "string"
          maxLength: 128
          writeOnly: true
    Password:
      type: "object"
      additionalProperties: false
      required:
        - "password"
      properties:
        password:
          type: "string"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Proof:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
    PasswordResetCompletion:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
        - "password"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        password:
          type: "string"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Reauthentication:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required:
            - "password"
          properties:
            password:
              type: "string"
              maxLength: 128
              writeOnly: true
        -
          type: "object"
          additionalProperties: false
          required:
            - "provider"
          properties:
            provider:
              type: "string"
              enum:
                - "google"
                - "facebook"
    AuthorizationUrl:
      type: "object"
      additionalProperties: false
      required:
        - "authorizationUrl"
      properties:
        authorizationUrl:
          type: "string"
          format: "uri"
    Csrf:
      type: "object"
      additionalProperties: false
      required:
        - "token"
        - "headerName"
      properties:
        token:
          type: "string"
        headerName:
          type: "string"
          const: "X-XSRF-TOKEN"
    Access:
      type: "object"
      additionalProperties: false
      required:
        - "accessToken"
        - "tokenType"
        - "expiresIn"
        - "sessionId"
      properties:
        accessToken:
          type: "string"
          description: "RS256 JWT, five minutes, memory only; never persist in localStorage."
        tokenType:
          type: "string"
          const: "Bearer"
        expiresIn:
          type: "integer"
          const: 300
        sessionId:
          type: "string"
          format: "uuid"
    Account:
      type: "object"
      additionalProperties: false
      required:
        - "userId"
        - "email"
        - "status"
        - "hasPassword"
        - "version"
      properties:
        userId:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "SUSPENDED"
            - "DELETION_PENDING"
            - "DELETED"
            - "PENDING_VERIFICATION"
        hasPassword:
          type: "boolean"
        version:
          type: integer
          minimum: 0
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "authenticatedAt"
        - "idleExpiresAt"
        - "absoluteExpiresAt"
        - "current"
      properties:
        id:
          type: "string"
          format: "uuid"
        authenticatedAt:
          type: "string"
          format: "date-time"
        idleExpiresAt:
          type: "string"
          format: "date-time"
        absoluteExpiresAt:
          type: "string"
          format: "date-time"
        current:
          type: "boolean"
    Sessions:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/Session"
    Identity:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "provider"
      properties:
        id:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
          enum:
            - "GOOGLE"
            - "FACEBOOK"
    Identities:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          maxItems: 2
          items:
            "$ref": "#/components/schemas/Identity"
    Profile:
      type: "object"
      additionalProperties: false
      required:
        - "userId"
        - "handle"
        - "displayName"
        - "bio"
        - "visibility"
        - "version"
      properties:
        userId:
          type: "string"
          format: "uuid"
        handle:
          type: "string"
        displayName:
          type: "string"
        bio:
          type: "string"
        visibility:
          type: "string"
          enum:
            - "PUBLIC"
            - "AUTHENTICATED"
            - "FRIENDS"
            - "PRIVATE"
        version:
          type: "integer"
          minimum: 0
    ProfileChange:
      type: "object"
      additionalProperties: false
      required:
        - "handle"
        - "displayName"
        - "bio"
        - "visibility"
      properties:
        handle:
          type: "string"
          pattern: "^[a-z0-9_]{3,30}$"
        displayName:
          type: "string"
          minLength: 1
          maxLength: 80
        bio:
          type: "string"
          maxLength: 1000
        visibility:
          type: "string"
          enum:
            - "PUBLIC"
            - "AUTHENTICATED"
            - "FRIENDS"
            - "PRIVATE"
    PreferenceChange:
      type: "object"
      additionalProperties: false
      required:
        - "locale"
        - "timeZone"
        - "defaultPostAudience"
      properties:
        locale:
          type: "string"
          maxLength: 35
        timeZone:
          type: "string"
          maxLength: 64
          description: "IANA timezone ID"
        defaultPostAudience:
          type: "string"
          enum:
            - "PUBLIC"
            - "FOLLOWERS"
            - "FRIENDS"
            - "ONLY_ME"
    Preferences:
      type: "object"
      additionalProperties: false
      required:
        - "locale"
        - "timeZone"
        - "defaultPostAudience"
        - "version"
      properties:
        locale:
          type: "string"
        timeZone:
          type: "string"
        defaultPostAudience:
          type: "string"
          enum:
            - "PUBLIC"
            - "FOLLOWERS"
            - "FRIENDS"
            - "ONLY_ME"
        version:
          type: "integer"
          minimum: 0
