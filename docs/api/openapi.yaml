        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "after"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 256
      "responses":
        "200":
          "description": "Own graph; active accounts and current bilateral blocks filtered, except own block management"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GraphUserPage"
        "default":
          "$ref": "#/components/responses/Problem"
  "/api/v1/users/{id}/graph/{kind}":
    "get":
      "operationId": "listVisibleProfileGraph"
      "summary": "Require current profile visibility; blocks deny; no private block/mute lists"
      "security":
        - {}
        -
          "BearerAuth": []
      "parameters":
