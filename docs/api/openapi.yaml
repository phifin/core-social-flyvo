    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
        - "requestId"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
        code:
          type: "string"
        requestId:
          type: "string"
        violations:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "field"
              - "code"
              - "message"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
    Email:
      type: "object"
      additionalProperties: false
      required:
        - "email"
      properties:
        email:
          type: "string"
          maxLength: 320
          format: "email"
    RegistrationCompletion:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        password:
          type:
            - "string"
            - "null"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Login:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          maxLength: 320
        password:
          type: "string"
          maxLength: 128
          writeOnly: true
    Password:
      type: "object"
      additionalProperties: false
      required:
        - "password"
      properties:
        password:
          type: "string"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Proof:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
    PasswordResetCompletion:
      type: "object"
      additionalProperties: false
      required:
        - "secret"
        - "password"
      properties:
        secret:
          type: "string"
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          writeOnly: true
        password:
          type: "string"
          minLength: 15
          maxLength: 128
          writeOnly: true
          description: "Unicode characters; common compromised values rejected; no composition rules."
    Reauthentication:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required:
            - "password"
          properties:
            password:
              type: "string"
              maxLength: 128
              writeOnly: true
        -
          type: "object"
          additionalProperties: false
          required:
            - "provider"
          properties:
            provider:
              type: "string"
              enum:
                - "google"
                - "facebook"
    AuthorizationUrl:
      type: "object"
      additionalProperties: false
      required:
        - "authorizationUrl"
      properties:
        authorizationUrl:
          type: "string"
          format: "uri"
    Csrf:
      type: "object"
      additionalProperties: false
      required:
        - "token"
        - "headerName"
      properties:
        token:
          type: "string"
        headerName:
          type: "string"
          const: "X-XSRF-TOKEN"
    Access:
      type: "object"
      additionalProperties: false
      required:
        - "accessToken"
        - "tokenType"
        - "expiresIn"
        - "sessionId"
      properties:
        accessToken:
          type: "string"
          description: "RS256 JWT, five minutes, memory only; never persist in localStorage."
        tokenType:
          type: "string"
          const: "Bearer"
        expiresIn:
          type: "integer"
          const: 300
        sessionId:
          type: "string"
          format: "uuid"
    Account:
      type: "object"
      additionalProperties: false
      required:
        - "userId"
        - "email"
        - "status"
        - "hasPassword"
        - "version"
      properties:
        userId:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "SUSPENDED"
            - "DELETION_PENDING"
            - "DELETED"
            - "PENDING_VERIFICATION"
        hasPassword:
          type: "boolean"
        version:
          type: integer
          minimum: 0
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "authenticatedAt"
        - "idleExpiresAt"
        - "absoluteExpiresAt"
        - "current"
      properties:
        id:
          type: "string"
          format: "uuid"
        authenticatedAt:
          type: "string"
          format: "date-time"
        idleExpiresAt:
          type: "string"
          format: "date-time"
        absoluteExpiresAt:
          type: "string"
          format: "date-time"
        current:
          type: "boolean"
    Sessions:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/Session"
    Identity:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "provider"
      properties:
        id:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
          enum:
            - "GOOGLE"
            - "FACEBOOK"
    Identities:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          maxItems: 2
          items:
            "$ref": "#/components/schemas/Identity"
    PostAudience:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [PUBLIC, FOLLOWERS, FRIENDS, CUSTOM, ONLY_ME, COMMUNITY]}
        recipientIds: {type: array, uniqueItems: true, maxItems: 100, items: {type: string, format: uuid}, description: Required nonempty only for CUSTOM; otherwise empty or omitted}
    PostMention:
      type: object
      additionalProperties: false
      required: [userId, start, end]
      properties:
        userId: {type: string, format: uuid}
        start: {type: integer, minimum: 0, description: UTF-16 offset, never splits surrogate pair}
        end: {type: integer, minimum: 1, description: Exclusive UTF-16 offset within body}
    PostAttachment:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId: {type: string, format: uuid}
        altText: {type: [string, 'null'], maxLength: 1000}
    PostEdit:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, maxLength: 10000, description: Plain text Unicode code points, not HTML}
        linkUrl: {type: [string, 'null'], maxLength: 2048, description: Absolute HTTP(S) without userinfo; never fetched}
        mentions: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/PostMention'}}
        media: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/PostAttachment'}}
    PostPublish:
      type: object
      additionalProperties: false
      required: [body, audience]
      properties:
        body: {type: string, maxLength: 10000}
        linkUrl: {type: [string, 'null'], maxLength: 2048}
        communityId: {type: [string, 'null'], format: uuid}
        audience: {$ref: '#/components/schemas/PostAudience'}
        mentions: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/PostMention'}}
        media: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/PostAttachment'}}
    Post:
      type: object
      additionalProperties: false
      required: [id, authorId, displayName, communityId, body, linkUrl, audience, recipientIds, mentions, hashtags, media, publishedAt, editedAt, revision, version]
      properties:
        id: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        displayName: {type: string}
        communityId: {type: [string, 'null'], format: uuid}
        body: {type: string, maxLength: 10000}
        linkUrl: {type: [string, 'null']}
        audience: {type: string, enum: [PUBLIC, FOLLOWERS, FRIENDS, CUSTOM, ONLY_ME, COMMUNITY]}
        recipientIds: {type: array, maxItems: 100, items: {type: string, format: uuid}, description: Owner-only list; empty for other readers}
        mentions: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/PostMention'}}
        hashtags: {type: array, maxItems: 10, items: {type: string}}
        media: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/PostAttachment'}}
        publishedAt: {type: string, format: date-time}
        editedAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer, minimum: 1}
        version: {type: integer, minimum: 0}
    PostPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Post'}}
        nextCursor: {type: [string, 'null']}
    PostRevisionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        nextCursor: {type: [string, 'null'], description: Exclusive revision ordinal for before parameter}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [number, editorId, body, linkUrl, audience, media, editedAt]
            properties:
              number: {type: integer, minimum: 1}
              editorId: {type: string, format: uuid}
              body: {type: string}
              linkUrl: {type: [string, 'null']}
              audience: {$ref: '#/components/schemas/PostAudience'}
              media: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/PostAttachment'}}
              editedAt: {type: string, format: date-time}
    ImageUpload:
      type: object
      additionalProperties: false
      required: [purpose, mime, bytes, sha256]
      properties:
        purpose: {type: string, enum: [POST, AVATAR]}
        mime: {type: string, enum: [image/jpeg, image/png, image/webp]}
        bytes: {type: integer, minimum: 1, maximum: 10485760}
        sha256: {type: string, minLength: 44, maxLength: 44, description: Base64 of raw SHA-256 digest}
    ImageUploadIntent:
      type: object
      additionalProperties: false
      required: [id, state, uploadUrl, headers, expiresAt]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [UPLOAD_PENDING]}
        uploadUrl: {type: string, format: uri, description: Secret capability, never log query string}
        headers: {type: object, additionalProperties: {type: array, items: {type: string}}}
        expiresAt: {type: string, format: date-time, description: Intent expiry; PUT signature can expire earlier}
    ImageStatus:
      type: object
      additionalProperties: false
      required: [id, purpose, state, version]
      properties:
        id: {type: string, format: uuid}
        purpose: {type: string, enum: [POST, AVATAR]}
        state: {type: string, enum: [UPLOAD_PENDING, UPLOADED, PROCESSING, READY, EXPIRED, REJECTED, FAILED, DELETING, DELETED]}
        version: {type: integer, minimum: 0}
    ImageVariants:
      type: array
      maxItems: 2
      items:
        type: object
        additionalProperties: false
        required: [name, url, mime, width, height]
        properties:
          name: {type: string, enum: [DISPLAY, THUMBNAIL]}
          url: {type: string, format: uri, description: Secret pinned capability, expires within 60 seconds}
          mime: {type: string, enum: [image/png]}
          width: {type: integer, minimum: 1, maximum: 2048}
          height: {type: integer, minimum: 1, maximum: 2048}
    Profile:
      type: "object"
      additionalProperties: false
      required:
        - "userId"
        - "handle"
        - "displayName"
        - "bio"
        - "visibility"
        - "version"
      properties:
        userId:
          type: "string"
          format: "uuid"
        handle:
          type: "string"
        displayName:
          type: "string"
        bio:
          type: "string"
        visibility:
          type: "string"
          enum:
            - "PUBLIC"
            - "AUTHENTICATED"
            - "FRIENDS"
            - "PRIVATE"
        version:
          type: "integer"
          minimum: 0
        avatarMediaId:
          type: [string, 'null']
          format: uuid
    ProfileChange:
      type: "object"
      additionalProperties: false
      required:
        - "handle"
        - "displayName"
        - "bio"
        - "visibility"
      properties:
        handle:
          type: "string"
          pattern: "^[a-z0-9_]{3,30}$"
        displayName:
          type: "string"
          minLength: 1
          maxLength: 80
        bio:
          type: "string"
          maxLength: 1000
        visibility:
          type: "string"
          enum:
            - "PUBLIC"
            - "AUTHENTICATED"
            - "FRIENDS"
            - "PRIVATE"
    PreferenceChange:
      type: "object"
      additionalProperties: false
      required:
        - "locale"
        - "timeZone"
        - "defaultPostAudience"
      properties:
        locale:
          type: "string"
          maxLength: 35
        timeZone:
          type: "string"
          maxLength: 64
          description: "IANA timezone ID"
        defaultPostAudience:
          type: "string"
          enum:
            - "PUBLIC"
            - "FOLLOWERS"
            - "FRIENDS"
            - "ONLY_ME"
    Preferences:
      type: "object"
      additionalProperties: false
      required:
        - "locale"
        - "timeZone"
        - "defaultPostAudience"
        - "version"
      properties:
        locale:
          type: "string"
        timeZone:
          type: "string"
        defaultPostAudience:
          type: "string"
          enum:
            - "PUBLIC"
            - "FOLLOWERS"
            - "FRIENDS"
            - "ONLY_ME"
        version:
          type: "integer"
          minimum: 0
