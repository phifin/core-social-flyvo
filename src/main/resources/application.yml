spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: social-core
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      pool-name: social-core
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      connection-init-sql: SET TIME ZONE 'UTC'; SET statement_timeout = '5s'; SET lock_timeout = '3s'
      data-source-properties:
        connectTimeout: 5
        socketTimeout: 5
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
  mvc:
    log-request-details: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
server:
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  auth:
    issuer: ${AUTH_ISSUER:https://social-core.invalid}
    audience: social-core-browser
    frontend-origin: ${FRONTEND_ORIGIN:https://social-core.invalid}
    signing-key-id: ${AUTH_SIGNING_KEY_ID:primary}
    private-key-file: ${AUTH_PRIVATE_KEY_FILE:}
    public-key-file: ${AUTH_PUBLIC_KEY_FILE:}
    retained-public-keys: ${AUTH_RETAINED_PUBLIC_KEYS:}
    oauth-authorize-per-minute: ${OAUTH_AUTHORIZE_PER_MINUTE:10}
    oauth-callback-per-minute: ${OAUTH_CALLBACK_PER_MINUTE:20}
  security:
    encryption-key-file: ${MAIL_ENCRYPTION_KEY_FILE:}
    limiter-key-file: ${LIMITER_KEY_FILE:}
    encryption-key-id: ${MAIL_ENCRYPTION_KEY_ID:primary}
  mail:
    from: ${MAIL_FROM:no-reply@social-core.invalid}
  worker:
    enabled: ${WORKER_ENABLED:true}
  erasure:
    enabled: ${ERASURE_SYNTHETIC_ENABLED:false}
    policy: ${ERASURE_POLICY:}
    archive-directory: ${ERASURE_ARCHIVE_DIRECTORY:}
    lineage: ${ERASURE_LINEAGE:}
  notification:
    stream:
      max-global: ${NOTIFICATION_STREAM_MAX_GLOBAL:100}
      max-per-user: ${NOTIFICATION_STREAM_MAX_PER_USER:2}
  database:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
